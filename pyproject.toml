[project]
name = "rtmdet-fusion"
version = "0.1.0"
description = "RTMDet-Fusion: real-time person detection, segmentation, head/body 3D keypoints, part masks and depth"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "tqdm>=4.65.0",
    # MMDetection stack (installed with openmim)
    "openmim>=0.3.9",
    "tensorboard>=2.20.0",
    # The dynamo ONNX export actually requires onnxscript>=0.6.0 (name collision bug,
    # pytorch #168211). The constraint stays at >=0.5.7 to match uv.lock: the nightly
    # (prerelease) torch prevents regenerating the lock, and a pyproject/lock mismatch makes
    # uv re-resolve for every platform (failing on macOS and pulling a newer torch nightly
    # elsewhere). tools/onnx_exporter.py enforces 0.6+ at runtime
    # (_assert_onnxscript_dynamo_ready). Install it with `uv pip install "onnxscript>=0.6.0"`.
    "onnxscript>=0.5.7",
    "onnx>=1.20.0",
    "onnxruntime>=1.23.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "pytest>=7.0.0",
]
viewer = [
    # PyQt5 is needed by the viewer and the AGORA scripts
    # pyqt5-qt5 5.15.3+ has no Windows wheels, hence the pinned version
    "PyQt5==5.15.11",
    "PyQt5-Qt5==5.15.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rtmdet_fusion"]

[tool.uv]
# MMDetection/MMEngine are installed with mim (after uv sync):
#   uv run mim install mmengine mmdet
# mmcv has to be built from source: see scripts/mmcv-build/README.md
# Note: `mim install mmcv` breaks the source-built mmcv

# Index for the CUDA build of PyTorch
# Blackwell GPUs (sm_120) need CUDA 12.8+ and PyTorch nightly

[tool.uv.sources]
torch = { index = "pytorch-nightly-cu128" }
torchvision = { index = "pytorch-nightly-cu128" }

[[tool.uv.index]]
name = "pytorch-nightly-cu128"
url = "https://download.pytorch.org/whl/nightly/cu128"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
