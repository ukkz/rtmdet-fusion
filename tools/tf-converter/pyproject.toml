[project]
name = "model-converter"
version = "0.1.0"
description = "ONNX to TensorFlow SavedModel converter for rtmdet_fusion"
requires-python = ">=3.10,<3.12"
dependencies = [
    "onnx2tf>=1.26.0",
    "onnx>=1.16.0,<1.17.0",
    "tensorflow>=2.15.0,<2.17.0",
    "tf-keras>=2.15.0,<2.17.0",
    "onnx-graphsurgeon",
    "protobuf>=4.21.0,<5.0.0",
    "psutil",
    "sng4onnx",
    "opencv-python",
    "onnxruntime",
    "onnxsim",
]

[dependency-groups]
dev = []
